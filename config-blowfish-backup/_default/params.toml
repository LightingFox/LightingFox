colorScheme = "blowfish"

defaultAppearance = "dark"
autoSwitchAppearance = true

enableSearch = true
enableCodeCopy = true

[homepage]
  layout = "profile"
  showRecent = true
  showRecentItems = 6

[article]
  showDate = true
  showAuthor = true
  showReadingTime = true
  showWordCount = true
  showTableOfContents = true
  showBreadcrumbs = true
  showPagination = true
  showZenMode = true

[list]
  showSummary = true
  showCards = true
  groupByYear = false