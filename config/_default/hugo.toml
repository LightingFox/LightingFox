baseURL = "https://lightingfox.github.io/"
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "LightingFox"
theme = "terminal"

enableRobotsTXT = true

[pagination]
  pagerSize = 10

[params]
  contentTypeName = "posts"
  showMenuItems = 3
  showLanguageSelector = false
  fullWidthTheme = false
  centerTheme = true
  autoCover = true
  showLastUpdated = false

[languages]
  [languages.zh-cn]
    label = "中文"
    title = "LightingFox"
    weight = 1

    [languages.zh-cn.params]
      subtitle = "C#、Unity、OpenGL 与编程笔记"
      owner = "LightingFox"
      keywords = "C#, Unity, OpenGL, 编程"
      copyright = "LightingFox"
      menuMore = "更多"
      readMore = "阅读全文"
      readOtherPosts = "阅读其他文章"
      newerPosts = "较新的文章"
      olderPosts = "较早的文章"
      missingContentMessage = "页面不存在"
      missingBackButtonLabel = "返回首页"

      [languages.zh-cn.params.logo]
        logoText = "LightingFox"
        logoHomeLink = "/"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 1

  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 2

  [[menu.main]]
    identifier = "football"
    name = "足球"
    url = "/football/"
    weight = 3